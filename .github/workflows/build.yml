name: Build KeepMarkNavigate Windows x64

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Microsoft compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Download and prepare OpenCPN dependencies
        shell: cmd
        run: |
          call buildwin\win_deps.bat

      - name: Configure CMake for 64-bit Release
        shell: pwsh
        run: |
          cmake -S . -B build -A x64

      - name: Build OpenCPN plugin tarball
        shell: pwsh
        run: |
          cmake --build build --config Release --target tarball

      - name: List build packages
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Recurse -Include *.tar.gz,*.zip,*.dll |
            Select-Object FullName, Length

      - name: Upload Windows x64 plugin package
        uses: actions/upload-artifact@v4
        with:
          name: KeepMarkNavigate-Windows-x64
          path: |
            **/*.tar.gz
            **/*.zip
            **/*.dll
          if-no-files-found: error
